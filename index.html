<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Heebo", "Arial Hebrew", "David", Arial, sans-serif;

  header {

    padding: 20px 0 12px;

  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; padding: 14px 16px; }
  .name { font-size: 19px; font-weight: 600; margin: 0 0 8px; color: #1c1c1e; }
  .codes { display: flex; flex-direction: column; gap: 4px; }
  .code-row { font-size: 16px; color: #1c1c1e; }
  .label { color: #8e8e93; margin-left: 6px; }
  .code { font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .empty-codes { font-size: 14px; color: #8e8e93; font-style: italic; }
  .no-results { text-align: center; padding: 40px 20px; color: #8e8e93; font-size: 16px; }
  mark { background: #fff3a8; color: inherit; padding: 0 2px; border-radius: 3px; }
  .install {
    display: none; margin-bottom: 14px; padding: 12px 14px;
    background: #e8f2ff; border: 1px solid #b9d9ff; border-radius: 12px;
    font-size: 14px; color: #1c1c1e; line-height: 1.5;
  }
  .install.show { display: block; }
  .install b { font-weight: 600; }
  .install-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .install button {
    font-family: inherit; font-size: 14px; font-weight: 600;
    border: 0; border-radius: 9px; padding: 9px 14px; cursor: pointer;
  }
  .btn-add { background: #007aff; color: #fff; }
  .btn-x { background: transparent; color: #8e8e93; padding: 9px 6px; }
  [hidden] { display: none !important; }
  .lock-box { max-width: 320px; margin: 18vh auto 0; padding: 0 16px; text-align: center; }
  .lock-icon { font-size: 40px; margin-bottom: 8px; }
  .lock-btn { width: 100%; margin-top: 12px; padding: 14px; font-size: 17px; font-family: inherit; font-weight: 600; border: 0; border-radius: 12px; cursor: pointer; }
  .lock-err { min-height: 22px; margin-top: 10px; color: #ff3b30; font-size: 15px; }
  .logout { background: none; border: 0; font-size: 16px; cursor: pointer; opacity: .5; vertical-align: middle; padding: 0 6px; }
  @media (prefers-color-scheme: dark) {
    .install { background: #0b2338; border-color: #17405f; color: #f2f2f7; }
    body { background: #000; color: #f2f2f7; }
    header { background: #000; border-bottom-color: #2c2c2e; }
    h1, .name, .code-row { color: #f2f2f7; }

    .label, .count, .empty-codes, .no-results { color: #8e8e93; }
    mark { background: #5c4d00; color: #fff3a8; }
  }

let BUILDINGS = [];

const LABELS = {
  building_code: "כניסה",
  garbage_code: "זבל",
  roof_code: "גג",
  safe_code: "כספת",
  extra_codes: "נוסף"
};
const ORDER = ["building_code", "garbage_code", "roof_code", "safe_code", "extra_codes"];

const collator = new Intl.Collator("he", { sensitivity: "base", numeric: true });

const listEl = document.getElementById("list");
const countEl = document.getElementById("count");
const qEl = document.getElementById("q");

function escapeHTML(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function highlight(text, query) {
  const t = escapeHTML(text);
  if (!query) return t;
  const q = escapeHTML(query);
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  return t.replace(re, m => `<mark>${m}</mark>`);
}

function matches(b, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  if (b.name.toLowerCase().includes(q)) return true;
  for (const key of ORDER) {
    const v = b[key];
    if (v && String(v).toLowerCase().includes(q)) return true;
  }
  return false;
}

function render(query) {
  const matched = BUILDINGS.filter(b => matches(b, query));
  if (matched.length === 0) {
    listEl.innerHTML = `<div class="no-results">לא נמצא בניין מתאים</div>`;
    countEl.textContent = "";
    return;
  }
  countEl.textContent = query
    ? `${matched.length} מתוך ${BUILDINGS.length}`
    : `${BUILDINGS.length} בנינים`;
  const html = matched.map(b => {
    const rows = ORDER
      .filter(key => b[key] != null && b[key] !== "")
      .map(key => `<div class="code-row"><span class="label">${LABELS[key]}:</span><span class="code">${highlight(b[key], query)}</span></div>`)
      .join("");
    const codesBlock = rows
      ? `<div class="codes">${rows}</div>`
      : `<div class="empty-codes">אין קוד רשום</div>`;
    return `<div class="card"><div class="name">${highlight(b.name, query)}</div>${codesBlock}</div>`;
  }).join("");
  listEl.innerHTML = html;
}

qEl.addEventListener("input", () => render(qEl.value.trim()));

function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function openVault(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(VAULT.salt), iterations: VAULT.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(VAULT.iv) }, key, b64(VAULT.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function unlock(pw, remember) {
  try {
    BUILDINGS = await openVault(pw);
  } catch (e) {
    return false;
  }
  BUILDINGS.sort((a, b) => collator.compare(a.name, b.name));
  if (remember) { try { localStorage.setItem(PW_KEY, pw); } catch (e) {} }
  lockEl.hidden = true;
  appEl.hidden = false;
  render("");
  return true;
}

document.getElementById("lockForm").addEventListener("submit", async e => {
  e.preventDefault();
  errEl.textContent = "בודק...";
  const ok = await unlock(pwEl.value, true);
  if (!ok) { errEl.textContent = "סיסמה שגויה"; pwEl.select(); }
});

document.getElementById("logout").addEventListener("click", () => {
  try { localStorage.removeItem(PW_KEY); } catch (e) {}
  location.reload();
});

(async () => {
  let saved = null;
  try { saved = localStorage.getItem(PW_KEY); } catch (e) {}
  if (saved && await unlock(saved, false)) return;
  if (saved) { try { localStorage.removeItem(PW_KEY); } catch (e) {} }
  lockEl.hidden = false;
  pwEl.focus();
})();
</script>

<script>
/* ── התקנה למסך הבית + עבודה בלי אינטרנט ── */
(function () {
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  const box = document.getElementById("install");
  if (!box) return;

  const standalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;
  if (standalone) return;

  let dismissed = false;
  try { dismissed = sessionStorage.getItem("hideInstall") === "1"; } catch (e) {}
  if (dismissed) return;

  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  function hide() {
    box.classList.remove("show");
    try { sessionStorage.setItem("hideInstall", "1"); } catch (e) {}
  }

  function showIOS() {
    box.innerHTML =
      '<div class="install-row"><div>' +
      '<b>שמור את זה במסך הבית</b><br>' +
      'לחץ על כפתור השיתוף למטה ואז על <b>«הוסף למסך הבית»</b> — אחר כך פשוט לוחצים על האייקון.' +
      '</div><button class="btn-x" id="xInstall">✕</button></div>';
    box.classList.add("show");
    document.getElementById("xInstall").addEventListener("click", hide);
  }

  function showAndroid(prompt) {
    box.innerHTML =
      '<div class="install-row"><div>' +
      '<b>שמור את זה במסך הבית</b><br>נכנסים בלחיצה אחת, עובד גם בלי אינטרנט.' +
      '</div><div><button class="btn-add" id="addBtn">התקנה</button>' +
      '<button class="btn-x" id="xInstall">✕</button></div></div>';
    box.classList.add("show");
    document.getElementById("xInstall").addEventListener("click", hide);
    document.getElementById("addBtn").addEventListener("click", async () => {
      prompt.prompt();
      try { await prompt.userChoice; } catch (e) {}
      hide();
    });
  }

  if (isIOS) {
    showIOS();
    return;
  }

  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    showAndroid(e);
  });
  window.addEventListener("appinstalled", hide);
})();
</script>
